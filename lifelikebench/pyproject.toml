[project]
name = "lifelike-bench"
version = "0.2.0"
description = "LifelikeBench: measuring, improving and distilling lifelikeness in LLM role-play"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
api = ["openai>=1.40", "anthropic>=0.40"]
dev = ["pytest"]
train = ["torch>=2.3", "transformers>=4.51", "peft>=0.13", "accelerate>=0.34"]

[project.scripts]
lifelike-bench = "lifelike_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lifelike_bench = ["prompts/*"]
